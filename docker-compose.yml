version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alreems-backend
    ports:
      - "${PORT:-9000}:${PORT:-9000}"
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PORT:-9000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
