apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alreems-backend-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.reems.co.in
      secretName: alreems-backend-tls
  rules:
    - host: api.reems.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alreems-backend-svc
                port:
                  number: 80
